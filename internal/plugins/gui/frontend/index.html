<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Ouroboros · Thread</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="nav.skip">To the session content</a>
  <aside id="sidebar" class="sidebar" data-i18n-aria="nav.sessions" aria-label="Session navigation">
    <!-- Beside the thread only the sessions of the part of it in view, as in the
         demo. The profile is chosen at start (ouro --profile NAME gui). -->
    <select id="profile" data-i18n-aria="nav.profile" aria-label="Profile" hidden disabled></select>
    <div class="sessions-heading">
      <h2 id="sessions-heading" data-i18n="sessions.title">Sessions</h2>
    </div>
    <div id="sessions" aria-labelledby="sessions-heading"></div>
    <div class="sidebar-footer">
      <button id="settings" class="settings-button" type="button" data-i18n-aria="nav.settings" data-i18n-title="nav.settingsShort" aria-label="Open settings" title="Settings" aria-haspopup="dialog"><span aria-hidden="true">⚙</span></button>
    </div>
  </aside>
  <main id="main" tabindex="-1" aria-labelledby="session-title">
    <header class="session-header">
      <div class="session-heading">
        <p class="eyebrow">Ouroboros</p>
        <h1 id="session-title" data-i18n="session.select">Select a session</h1>
        <p id="session-meta"></p>
      </div>
      <button id="back-to-thread" type="button" data-i18n="nav.backToThread" hidden>To the thread</button>
    </header>
    <!-- The chat history scrolls on its own, and only it bounces at its ends:
         header, composer and sidebar stay where they are. -->
    <div class="transcript-frame">
    <div id="transcript" class="transcript-scroller">
      <div class="transcript-wrap">
        <div id="transcript-start" aria-hidden="true"></div>
        <p id="error" role="alert" hidden></p>
        <noscript><p data-i18n="noscript">Please enable JavaScript to open the sessions.</p></noscript>
        <div id="content" data-i18n-aria="transcript.label" aria-label="Session transcript"></div>
        <div id="transcript-end" aria-hidden="true"></div>
      </div>
    </div>
    <div class="transcript-fade" aria-hidden="true"></div>
    </div>
    <div class="composer-dock">
      <p id="session-status" role="status">Loading the thread …</p>
      <form id="composer" class="composer" data-i18n-aria="composer.label" aria-label="Write a message">
        <section id="question-panel" class="question-panel" aria-labelledby="question-heading" aria-live="polite" hidden>
          <h2 id="question-heading" data-i18n="question.heading">Your decision</h2>
          <p id="question-text"></p>
          <div id="question-options" role="group" data-i18n-aria="question.options" aria-label="Answer options"></div>
          <p id="question-hint"></p>
        </section>
        <!-- One line, as in the demo: it grows with what is written. -->
        <label class="sr-only" for="draft" data-i18n="composer.draftLabel">Message / own answer</label>
        <div class="composer-row">
          <span class="composer-prompt" aria-hidden="true">›</span>
          <textarea id="draft" rows="1" data-i18n-placeholder="composer.placeholder" placeholder="Write a message" aria-describedby="composer-hint" disabled></textarea>
          <button id="stop" type="button" data-i18n="composer.stop" disabled>Stop</button>
          <button id="send" type="submit" data-i18n-aria="composer.send" data-i18n-title="composer.send" aria-label="Send" title="Send" disabled><span aria-hidden="true">↑</span></button>
        </div>
        <div class="composer-actions">
          <p id="composer-hint" class="sr-only" data-i18n="composer.enterHint">Enter sends · Shift+Enter for a new line</p>
          <p id="send-status" role="status"></p>
        </div>
        <p id="send-error" role="alert" hidden></p>
      </form>
    </div>
  </main>
  <aside id="context-rail" class="context-rail" data-i18n-aria="context.rail" aria-label="Tool context">
    <p class="eyebrow" data-i18n="context.eyebrow">Context</p>
    <h2 id="context-title">[Thread]</h2>
    <p id="context-note">Open a tool result in the transcript to read it here.</p>
    <div id="context-details"></div>
  </aside>
</body>
</html>
